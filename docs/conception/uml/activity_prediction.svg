e style="stroke: #4A2E1B; stroke-width: 1.5;" x1="164.5" x2="164.5" y1="427.6367" y2="449.6367"/><polygon fill="#4A2E1B" points="160.5,439.6367,164.5,449.6367,168.5,439.6367,164.5,443.6367" style="stroke: #4A2E1B; stroke-width: 1.0;"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="376.75" x2="402" y1="427.6367" y2="427.6367"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="402" x2="402" y1="427.6367" y2="449.6367"/><polygon fill="#4A2E1B" points="398,439.6367,402,449.6367,406,439.6367,402,443.6367" style="stroke: #4A2E1B; stroke-width: 1.0;"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="164.5" x2="164.5" y1="755.2734" y2="773.2734"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="164.5" x2="271.25" y1="773.2734" y2="773.2734"/><polygon fill="#4A2E1B" points="261.25,769.2734,271.25,773.2734,261.25,777.2734,265.25,773.2734" style="stroke: #4A2E1B; stroke-width: 1.0;"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="402" x2="402" y1="498.6758" y2="773.2734"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="402" x2="295.25" y1="773.2734" y2="773.2734"/><polygon fill="#4A2E1B" points="305.25,769.2734,295.25,773.2734,305.25,777.2734,301.25,773.2734" style="stroke: #4A2E1B; stroke-width: 1.0;"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="283.25" x2="283.25" y1="395.6367" y2="415.6367"/><polygon fill="#4A2E1B" points="279.25,405.6367,283.25,415.6367,287.25,405.6367,283.25,409.6367" style="stroke: #4A2E1B; stroke-width: 1.0;"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="283.25" x2="283.25" y1="785.2734" y2="805.2734"/><polygon fill="#4A2E1B" points="279.25,795.2734,283.25,805.2734,287.25,795.2734,283.25,799.2734" style="stroke: #4A2E1B; stroke-width: 1.0;"/><line style="stroke: #4A2E1B; stroke-width: 1.5;" x1="283.25" x2="283.25" y1="839.793" y2="875.252"/><polygon fill="#4A2E1B" points="279.25,865.252,283.25,875.252,287.25,865.252,283.25,869.252" style="stroke: #4A2E1B; stroke-width: 1.0;"/><!--MD5=[70120bc1c10be31bf7aa54a9ceedc1a3]
@startuml
skinparam defaultFontName Arial
skinparam backgroundColor #FFFFFF
skinparam shadowing false
skinparam ArrowColor #4A2E1B
skinparam classBackgroundColor #FFFFFF
skinparam classBorderColor #995932
skinparam classHeaderBackgroundColor #F3E9DD
skinparam packageBorderColor #4A2E1B
skinparam componentBorderColor #995932
skinparam componentBackgroundColor #FFFFFF
skinparam nodeBorderColor #4A2E1B
skinparam nodeBackgroundColor #FAF5EF
skinparam usecaseBorderColor #995932
skinparam usecaseBackgroundColor #FFFFFF
skinparam actorBorderColor #4A2E1B
skinparam activityBorderColor #995932
skinparam activityBackgroundColor #FFFFFF
skinparam activityDiamondBorderColor #C19A6B
skinparam sequenceParticipantBorderColor #995932
skinparam sequenceParticipantBackgroundColor #FFFFFF
skinparam sequenceLifeLineBorderColor #C19A6B
skinparam noteBackgroundColor #FAF5EF
skinparam noteBorderColor #C19A6B
skinparam databaseBorderColor #4A2E1B
start
:L'agent saisit la transaction;
:Validation des champs par l'API;
:Enregistrement de la transaction
(statut « en attente »);
if (Mobile money avec un type d'opération ?) then (oui)
  :Modèle mobile money actif
  (type d'opération, montant, heure);
else (non)
  :Modèle carte actif
  (carte, paiement en ligne, virement);
endif
:Probabilité de fraude;
if (Probabilité ≥ seuil du modèle ?) then (oui : fraude prédite)
  :Créer une alerte
  (gravité selon le score);
  :Paiement suspendu
  (statut « en cours d'examen »);
  :L'analyste examine l'alerte;
  if (Fraude confirmée ?) then (oui)
    :Paiement refusé
    (statut « frauduleuse »);
  else (non)
    :Paiement libéré
    (statut « légitime »);
  endif
else (non : non fraude)
  :Paiement accepté
  (statut « légitime »);
endif
:Journal d'audit et tableau de bord à jour;
stop
note right
  Sans modèle mobile money actif,
  le modèle carte prend le relais.
  Si le scoring échoue, la transaction
  reste « en attente », non scorée.
end note
@enduml

