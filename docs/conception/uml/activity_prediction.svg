<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="934px" preserveAspectRatio="none" style="width:564px;height:934px;" version="1.1" viewBox="0 0 564 934" width="564px" zoomAndPan="magnify"><defs/><g><ellipse cx="283.25" cy="20" fill="#000000" rx="10" ry="10" style="stroke: none; stroke-width: 1.0;"/><rect fill="#FFFFFF" height="34.5195" rx="12.5" ry="12.5" style="stroke: #995932; stroke-width: 1.5;" width="175" x="195.75" y="50"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="155" x="205.75" y="71.625">L'agent saisit la transaction</text><rect fill="#FFFFFF" height="34.5195" rx="12.5" ry="12.5" style="stroke: #995932; stroke-width: 1.5;" width="198" x="184.25" y="104.5195"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="178" x="194.25" y="126.1445">Validation des champs par l'API</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke: #995932; stroke-width: 1.5;" width="204" x="181.25" y="159.0391"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="184" x="191.25" y="180.6641">Enregistrement de la transaction</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="120" x="191.25" y="195.1836">(statut « en attente »)</text><polygon fill="#FEFECE" points="174.25,228.0781,392.25,228.0781,404.25,240.0781,392.25,252.0781,174.25,252.0781,162.25,240.0781,174.25,228.0781" style="stroke: #C19A6B; stroke-width: 1.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="218" x="174.25" y="244.0796">Mobile money avec un type d'opération ?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="