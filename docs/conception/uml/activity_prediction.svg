 y="651.5811">non</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke: #995932; stroke-width: 1.5;" width="150" x="10" y="676.2344"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="93" x="20" y="697.8594">Paiement refusé</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="130" x="20" y="712.3789">(statut « frauduleuse »)</text><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke: #995932; stroke-width: 1.5;" width="128" x="180" y="676.2344"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="89" x="190" y="697.8594">Paiement libéré</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="108" x="190" y="712.3789">(statut « légitime »)</text><polygon fill="#FEFECE" points="164.5,731.2734,176.5,743.2734,164.5,755.2734,152.5,743.2734,164.5,731.2734" style="stroke: #C19A6B; stroke-width: 1.5;"/><rect fill="#FFFFFF" height="49.0391" rx="12.5" ry="12.5" style="stroke: #995932; stroke-width: 1.5;" width="128" x="338" y="449.6367"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="103" x="348" y="471.2617">Paiement accepté</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="108" x="348" y="485.7813">(statut « légitime »)</text><polygon fill="#FEFECE" points="283.25,761.2734,295.25,773.2734,283.25,785.2734,271.25,773.2734,283.25,761.2734" style="stroke: #C19A6B; stroke-width: 1.5;"/><rect fill="#FFFFFF" height="34.5195" rx="12.5" ry="12.5" style="stroke: #995932; stroke-width: 1.5;" width="245" x="160.75" y="805.2734"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="225" x="170.75" y="826.8984">Journal d'audit et tableau de bord à jour</text><path d="M314.25,849.793 L314.25,882