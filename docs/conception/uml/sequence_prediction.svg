@startuml
skinparam defaultFontName Arial
skinparam backgroundColor #FFFFFF
skinparam shadowing false
skinparam ArrowColor #4A2E1B
skinparam classBackgroundColor #FFFFFF
skinparam classBorderColor #995932
skinparam classHeaderBackgroundColor #F3E9DD
skinparam packageBorderColor #4A2E1B
skinparam componentBorderColor #995932
skinparam componentBackgroundColor #FFFFFF
skinparam nodeBorderColor #4A2E1B
skinparam nodeBackgroundColor #FAF5EF
skinparam usecaseBorderColor #995932
skinparam usecaseBackgroundColor #FFFFFF
skinparam actorBorderColor #4A2E1B
skinparam activityBorderColor #995932
skinparam activityBackgroundColor #FFFFFF
skinparam activityDiamondBorderColor #C19A6B
skinparam sequenceParticipantBorderColor #995932
skinparam sequenceParticipantBackgroundColor #FFFFFF
skinparam sequenceLifeLineBorderColor #C19A6B
skinparam noteBackgroundColor #FAF5EF
skinparam noteBorderColor #C19A6B
skinparam databaseBorderColor #4A2E1B
actor "Agent" as Agent
participant "React" as React
participant "API Django REST" as API
participant "Service de scoring" as Scoring
participant "Modèle ML\n(carte ou mobile money)" as ML
database PostgreSQL
actor "Analyste" as Analyste

Agent -> React : saisit la transaction
React -> API : POST /api/transactions/
API -> PostgreSQL : enregistre la transaction (en attente)
API -> Scoring : score_transaction(transaction)
Scoring -> PostgreSQL : modèle actif de la famille
Scoring -> ML : probabilité de fraude
ML - -> Scoring : probabilité
alt probabilité ≥ seuil du modèle (fraude prédite)
  Scoring -> PostgreSQL : prédiction + alerte,\nstatut « en cours d'examen »
else non fraude
  Scoring -> PostgreSQL : prédiction, statut « légitime »
end
API - -> React : 201 Created (score, statut, alerte)
React - -> Agent : « Paiement suspendu » ou « Paiement accepté »

== Décision de l'analyste ==
Analyste -> React : ouvre les alertes
React -> API : GET /api/alerts/
API - -> React : alertes (paiement suspendu depuis…)
Analyste -> React : commente et confirme la fraude
React -> API : POST /api/alerts/{id}/confirm/
API -> PostgreSQL : alerte confirmée,\ntransaction « frauduleuse »
API - -> React : alerte à jour
React - -> Analyste : « Paiement refusé · vérifié en … »
note over API, PostgreSQL : chaque écriture (POST, PUT, PATCH, DELETE) et chaque lecture sensible\n(fiche transaction, export CSV, rapport) est inscrite au journal d'audit
@enduml

