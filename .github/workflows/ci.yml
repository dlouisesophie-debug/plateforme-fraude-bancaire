name: CI FraudGuard

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fraudguard_test
          POSTGRES_USER: fraudguard
          POSTGRES_PASSWORD: fraudguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraudguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lancer les tests Django
        working-directory: backend
        env:
          POSTGRES_DB: fraudguard_test
          POSTGRES_USER: fraudguard
          POSTGRES_PASSWORD: fraudguard
          POSTGRES_HOST: localhost
          DJANGO_SECRET_KEY: ci-test-key
        run: python manage.py test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dependances
        working-directory: frontend
        run: npm install
      - name: Build de production
        working-directory: frontend
        run: npm run build
