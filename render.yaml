# Blueprint Render — FraudGuard (CDC §11 : déploiement public via Docker)
#
# Render > New > Blueprint > choisir ce dépôt, branche main.
# 3 ressources : PostgreSQL, API Django (Docker), frontend React (Docker + Nginx).
#
# URLs attendues (si les noms sont libres sur Render) :
#   API      : https://fraudguard-api.onrender.com
#   Frontend : https://fraudguard-web.onrender.com
# Si Render ajoute un suffixe au nom (ex. fraudguard-api-x7k2), corriger
# DJANGO_CORS_ALLOWED_ORIGINS et REACT_APP_API_URL dans le tableau de bord,
# puis redéployer le frontend (l'URL de l'API est intégrée au build React).

databases:
  - name: fraudguard-db
    plan: free
    region: frankfurt          # région la plus proche de Dakar
    databaseName: fraudguard
    user: fraudguard

services:
  # ---------------- Backend : Django REST + modèle ML ----------------
  - type: web
    name: fraudguard-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .           # racine : l'image embarque aussi ml/models et ml/src
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraudguard-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # clé aléatoire générée par Render, jamais dans Git
      - key: DJANGO_ALLOWED_HOSTS
        value: fraudguard-api.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://fraudguard-web.onrender.com
      - key: FRAUD_ALERT_THRESHOLD
        value: "0.7"
      - key: WEB_CONCURRENCY
        value: "1"             # 512 Mo de RAM en offre gratuite : 1 worker Gunicorn
      - key: DEMO_PASSWORD
        sync: false            # demandé à la création : mot de passe des comptes démo

  # ---------------- Frontend : build React servi par Nginx ----------------
  - type: web
    name: fraudguard-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      # Transmises comme build args (ARG du Dockerfile) : intégrées au build.
      - key: REACT_APP_API_URL
        value: https://fraudguard-api.onrender.com/api
      - key: REACT_APP_USE_MOCKS
        value: "false"
